<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>TechConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div id="formulario">
        <h2>Cadastro de Usuário</h2>


        <input placeholder="Digite seu nome" type="text" id="nome"><br><br>
        <input placeholder="Digite um email" type="text" id="email"><br><br>
        <input placeholder="Digite sua senha" type="password" id="senha">
        <p id="senhaText"></p>

        <input placeholder="Confirma sua senha" type="password" id="senhaConfirm"><br>
        <p id="confirmText"></p><br>
        <input placeholder="Digite um telefone" type="text" id="telefone" title="Use o formato (99)99999-9999">
        <button id="addTel">Adicionar telefone</button><br>
        <ul id="listaTel"></ul>
        <input placeholder="Digite seu CEP" type="text" id="endereco" title="Use o formato 00000-000"><br><br>

        <button type="button" id="cadastrar">Cadastrar</button>

        <p id="mensagem"></p>
        <p id="obgText"></p>
        <p id="compSenha"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
