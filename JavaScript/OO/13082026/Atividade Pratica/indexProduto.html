<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos com desconto aplicado</title>
</head>
<body>
    <h1>Cadastro de Produtos</h1>

    <input id="nome" type="text" placeholder="Nome">
    <br>
    <input id="preco" type="number" placeholder="Preço">
    <br>
    <input id="categoria" type="text" placeholder="Categoria">
    <br>
    <input id="desconto" type="text" placeholder="Desconto">
    <br><br>
    <button id="botaoCadastrar">
        Cadastrar Produto
    </button>

    <div id="resultado">

    </div>


<script src="scriptProduto.js"></script>
</body>
</html>
