<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca inteligente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <div id="titulo">
            <i class="iconeLivro bi bi-book"></i>
            <h2>Sistema de Biblioteca</h2>
        </div>

        <div class="containerPesquisa">
            <input id="barraPesquisa" type="text" placeholder="Busque livros de diferentes gêneros!"><i
                class="iconeLupa bi bi-search"></i>
        </div>
        <div class="containerOpcoes">
            <i class="iconeSino bi bi-bell"></i>

            <i class="iconePerson bi bi-person-circle"></i> <span>Administrador</span>

        </div>
    </header>






    <script src="script.js"></script>
</body>

</html>
