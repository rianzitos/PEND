<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Drag and Drop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div id="item" draggable="true" ondragstart="drag(event)">Arraste-me</div>

        <div id="destino" ondragover="permitirSoltar(event)" ondrop="soltar(event)">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
