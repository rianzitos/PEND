<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
    <link rel="stylesheet" href="formulário.css">
</head>

<body>
    <div class="voltar-container">
        <a href="" class="botao-voltar">
            <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png" alt="Início" class="icone-casa">
        </a>
    </div>
    <div class="botao-direita">
        <a href="" class="botao-voltar">
            <img src="https://cdn-icons-png.freepik.com/512/59/59045.png" alt="Menu" class="icone-pessoa">
        </a>
    </div>

    <div class="container-header">
        <header>
            <h1>Formulário de Inscrição</h1>
        </header>
    </div>
    <br>
    <main>
        <form action="cadastro.php" method="post">
            <p><label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu Nome Completo" required>
            </p>
            <p><label>E-mail:</label>
                <input type="email" name="email" placeholder="Digite seu Email" required>
            </p>
            <p><label>Telefone:</label>
                <select name="pais" required title="SELECIONE O SEU PAÍS">
                    <option value="">---</option>
                    <option value="brasil">🇧🇷 +55</option>
                    <option value="argentina">🇦🇷 +54</option>
                    <option value="usa">🇺🇸 +1</option>
                    <option value="franca">🇫🇷 +33</option>
                </select>
                <input type="text" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    placeholder="(99) 99999-9999" required title="Use o formato: (99) 99999-9999">
            </p>
            <p><label>CPF:</label>
                <input type="text" name="cpf" pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}" placeholder="999.999.999-99"
                    required title="Use o formato: 999.999.999-99">
            </p>
            <p><label>Data de Nascimento:</label>
                <input type="text" name="data" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" placeholder="XX/XX/XXXX" required
                    title="Use o formato: XX/XX/XXXX">
            </p>
            <p><label>Gênero:</label>
                <input type="radio" name="genero" value="M">Masculino
                <input type="radio" name="genero" value="F">Feminino
            </p>
            <p><label>Idiomas de Interesse (Opcional): </label>
                <input type="checkbox" name="interesses" value="ingles">Inglês
                <input type="checkbox" name="interesses" value="espanhol">Espanhol
                <input type="checkbox" name="interesses" value="frances">Francês
            </p>
            <div class="container-botao">
                <input class="botao" type="submit" value="Enviar">
                <input class="botao" type="reset" value="Limpar">
            </div>

        </form>
    </main>
    <p>
    <footer>
        <h3>
            Todos os direitos Reservados à
            <br>
            ©Escola de Idiomas Global
        </h3>
    </footer>
</body>

</html>
